<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Elements.</title>
</head>
<body>
    <!-- Structural Elements in HTML 5 -->
    
    <!-- Div: The div element has been used for many years to configure a generic structural area
         or “division” on a web page as a block display with empty space above and below.
         A div element begins with a <div> tag and ends with a </div> tag. 
         A generic container used to group elements for styling purposes or to apply CSS. It has no semantic meaning by itself but is widely used in layout creation.
         
    -->
    
    <!-- Header: The purpose of the HTML5 header element is to contain the headings
         of either a web page document or an area within the document such
         as a section or article (more on the section element and article element in Chapter 6). The header element begins with the <header> tag and ends with the
         </header> tag. The header element is block display and typically contains one or more
         heading level elements (h1 through h6).
    -->
    
    <!-- Nav: The purpose of the HTML5 nav element is to contain a section of navigation links. The
              block display nav element begins with the <nav> tag and ends with the </nav> tag.     
    -->

    <!-- main: The purpose of the HTML5 main element is to contain the main content of a web page
        document. There should be only one main element per web page. The block display main
        element begins with the <main> tag and ends with the </main> tag.
    -->

    <!--Footer: The purpose of the HTML5 footer element is to contain the footer content of a web page
        or section of a web page. The block display footer element begins with the <footer> tag
        and ends with the </footer> tag.
    -->

    <!-- Aside: This contains a section that doesnt belong with the main content, but it is related -->

    <!-- arrticle: This indicates a self-contained piece of content, such as a blog post -->

    <!-- section: This reps a thematic roping of content on a web page. -->

    <!-- Using styling tags like <b>, <i>, and <small> in HTML is not considered obsolete, but it's generally discouraged in modern web development. These tags are still valid in HTML5, but they are considered "presentational" elements, meaning they describe how content should appear visually rather than its meaning or structure.

        The modern approach encourages separating content structure (HTML) from presentation (CSS). Instead of using tags like <b> and <i>, you can use semantic HTML elements (like <strong>, <em>, etc.) that convey meaning, and apply styling through CSS. For example:

        Bold text: Instead of <b>, use <strong> for emphasis, and then style it using CSS for visual boldness.
        Italic text: Instead of <i>, use <em> for emphasis, and then apply the italic style via CSS.
        Smaller text: Instead of <small>, use CSS to adjust the font size.
    -->
</body>
</html>
