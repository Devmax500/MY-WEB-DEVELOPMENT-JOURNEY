<!-- In HTML and CSS, block display refers to the behavior of an element when it is set to display: block;.

Characteristics of Block Elements:

1. Takes up the full width: A block element automatically stretches to fill the entire width of its parent container unless a specific width is set.

2. Starts on a new line: Block elements begin on a new line and push the following content below them.

3. Height and Width: You can set height, width, margin, and padding for block elements.

4. Examples: Common block elements in HTML include <div>, <p>, <h1> to <h6>, <ul>, <ol>, and <li>.


Example:

<div style="display: block; background-color: lightblue;">
    This is a block-level element.
</div>
<p style="display: block; color: green;">
    This is another block-level element.
</p>

When you apply display: block to an element, it behaves like a traditional block element, regardless of its default display type (e.g., inline or inline-block) : this means that when you use the CSS property display: block on an element, it makes that element behave like a traditional block element, even if the element's default display behavior is not block-level.

n.b: In web development, a traditional block element refers to an HTML element that is rendered to occupy the full width of its parent container by default

A parent element is an HTML element that contains or wraps around one or more other elements. It provides a context or container for its child elements. The parent-child relationship is a way to describe how elements are nested within one another.

A child element is an HTML element that is nested within another element (the parent). The child element inherits some properties from its parent and can be influenced by its parent's styling and behavior.

If you want to modify how an element behaves, you can use display values like inline, inline-block, or flex. -->


<!-- Inline elements are elements in HTML and CSS that:

1. Do not start on a new line: Inline elements appear on the same line as other content, continuing horizontally.

2. Take up only as much width as needed: They only occupy as much width as their content requires.

3. Cannot have height or width set directly: You cannot apply height or width properties to inline elements (though padding, margin, and border can apply, but only horizontally).


Common Inline Elements:

Examples of inline elements in HTML include:

<span>

<a> (anchor tags)

<strong>

<em>

<img>

<label>

Differences Between Inline and Block Elements:

Example:

<p>This is a <span style="color: red;">red inline text</span> inside a paragraph.</p>

In this example:

<p> is a block element, so it starts on a new line.

<span> is an inline element, so it stays in line with the surrounding text.

Changing Inline to Block or Vice Versa:

You can change the default behavior using the display property in CSS:

To make an inline element behave like a block element:

span {
  display: block;
}
-->

<!-- Accessibility and Headings are crucial in ensuring that web content is usable and navigable for everyone, including people with disabilities. Proper use of headings enhances the accessibility of a web page, making it easier for assistive technologies, such as screen readers, to interpret and present content to users.

Importance of Headings for Accessibility
Content Organization: Headings create a logical structure for a web page. They break content into sections, making it easier to read and understand.
Navigation for Screen Readers: Screen reader users often navigate a page using headings. They can jump from one heading to the next to quickly find the section they are interested in.
Improved Usability: Clear and well-structured headings benefit all users, not just those with disabilities, by enhancing the readability and scannability of content.
Best Practices for Accessible Headings
Use Correct Heading Levels:

HTML provides six heading levels, from <h1> to <h6>.
Use <h1> for the main title of the page and subsequent heading levels (<h2>, <h3>, etc.) to create a hierarchy that reflects the content's structure.
Do not skip heading levels; maintain a logical order. For example, do not jump from <h1> to <h4> without <h2> or <h3> in between.
One <h1> per Page:

Use one <h1> heading per page, typically for the page title. This helps with SEO and provides a clear starting point for screen readers.
Subsequent headings should reflect the content's structure and importance.
Descriptive and Meaningful Text:

Make sure your headings are descriptive and give users a good idea of the content that follows.
Avoid using vague terms like "Section 1" or "Click Here."
Do Not Use Headings for Styling:

Avoid using heading tags solely for visual styling. Headings should be used to define the structure, not just to make text bold or large.
Use CSS for styling instead.
Avoid Empty Headings:

Do not leave heading tags empty, as this creates confusion for screen reader users and adds unnecessary complexity. -->
