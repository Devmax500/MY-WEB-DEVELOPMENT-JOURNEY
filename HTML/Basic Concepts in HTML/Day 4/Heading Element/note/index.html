<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" charset="adeyemi moses">
    <title>Heading</title>
</head>
<body>
    <!-- The headings in HTML(h1 - h6) -->
    <h1>Hello World</h1>
    <h2>Hello Mum</h2>
    <h3>Hello Dad</h3>
    <h4>Welcome Home</h4>
    <h5>Welcome to my first Website</h5>
    <h6>This is a very interesting stuff to see</h6>
</body>
<header id="container-1"></header>
</html>

<!-- Take note of the following: -->
<!-- In HTML headings, h1 is the biggest of them all. -->
<!-- While h6 is the smallest of them all. -->
<!-- h1 is the main heading, while h2-h6 are used as a sub-headings -->
<!-- Search engines use the headings to index the structure and content of your web pages. -->
<!-- Dont use headings to make big or bold text. -->
<!-- Each HTML heading has a default size. However, you can specify the size for any heading with the style attribute, using the CSS font-size property: -->
<!-- w3c validator is used to check for errors in an html file document -->
<!-- Headers give semantic i.e giving meanings to your web-pages, and it is used in the heading section of a website -->
<!-- Syntax for heading: <header></header> -->
